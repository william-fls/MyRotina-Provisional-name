<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark-tech">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Rotina</title>
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Minha Rotina" />
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard" data-title="Minha Rotina">

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <nav id="sidebar" class="sidebar" role="navigation" aria-label="Navegação principal">
    <div class="nav-logo"><span class="nav-logo-mark">M</span><span>Minha Rotina</span></div>

    <div class="nav-section">Menu</div>
    <a class="nav-item active" href="./index.html" aria-current="page">
      <i data-lucide="layout-dashboard" style="width:20px;height:20px;flex-shrink:0"></i>
      <span class="nav-label">Hoje</span>
    </a>
    <a class="nav-item" href="./planejar.html">
      <i data-lucide="check-square" style="width:20px;height:20px;flex-shrink:0"></i>
      <span class="nav-label">Planejar</span>
    </a>
    <a class="nav-item" href="./ajustes.html">
      <i data-lucide="settings-2" style="width:20px;height:20px;flex-shrink:0"></i>
      <span class="nav-label">Ajustes</span>
    </a>

    <div class="nav-footer"><span class="nav-dot" aria-hidden="true"></span>Dados salvos localmente</div>
  </nav>

  <main id="main">

    <!-- ==================== HOJE ==================== -->
    <section class="page active" id="page-dashboard">
      <div class="dash-hero-row mb-3">
        <div class="dashboard-greeting">
          <h1 id="greeting-text" class="dashboard-greeting-title"></h1>
          <span id="user-name" class="dashboard-greeting-name"></span>
        </div>
        <div id="dashboard-now-pill" class="settings-pill-card"></div>
        <div class="dash-hero-progress">
          <div class="dash-hero-progress-top">
            <span class="dash-hero-progress-label">Progresso</span>
            <span id="ov-progress" class="dash-hero-progress-pct">0%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="ov-progress-bar" style="width:0%"></div></div>
          <div class="dash-hero-progress-meta">
            <strong id="ov-tasks-done">0/0</strong> tarefas
            <strong id="ov-daily-done">0/0</strong> diárias
            <strong id="dash-stat-tasks">0</strong> feitas
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="card" id="dash-card-focus">
          <div class="dash-card-head">
            <div class="section-title" style="margin-bottom:0">Foco</div>
            <div id="dashboard-now-range" class="dashboard-now-range"></div>
          </div>
          <div id="dashboard-now-title" class="dashboard-now-title"></div>
          <div id="dashboard-now-list"></div>
        </div>

        <div class="card" id="dash-card-tasks">
          <div class="dash-card-head">
            <div class="section-title" style="margin-bottom:0">Hoje</div>
            <a class="btn btn-ghost" href="./planejar.html" style="padding:4px 10px;font-size:11px">Ver mais</a>
          </div>
          <div id="dash-tasks-list"></div>
        </div>

        <div class="card" id="dash-card-daily">
          <div class="dash-card-head">
            <div class="section-title" style="margin-bottom:0">Diárias</div>
            <a class="btn btn-ghost" href="./planejar.html" style="padding:4px 10px;font-size:11px">Ver mais</a>
          </div>
          <div id="dash-daily-list"></div>
        </div>
      </div>
    </section>

  </main>

  <nav class="mobile-dock" aria-label="Navegação rápida" role="navigation">
    <a class="mobile-dock-item active" href="./index.html" aria-current="page">
      <i data-lucide="layout-dashboard" style="width:18px;height:18px"></i>
      <span>Hoje</span>
    </a>
    <a class="mobile-dock-item" href="./planejar.html">
      <i data-lucide="check-square" style="width:18px;height:18px"></i>
      <span>Plano</span>
    </a>
    <a class="mobile-dock-item" href="./ajustes.html">
      <i data-lucide="settings-2" style="width:18px;height:18px"></i>
      <span>Ajustes</span>
    </a>
  </nav>

  <!-- Name Modal -->
  <div class="modal-overlay" id="modal-name" role="dialog" aria-modal="true" aria-labelledby="name-modal-title" aria-hidden="true">
    <div class="modal">
      <div class="modal-title" id="name-modal-title">Seu nome</div>
      <div class="mb-3"><input type="text" id="name-input" placeholder="Nome..." maxlength="30" /></div>
      <div class="flex gap-2">
        <button class="btn btn-primary" data-action="save-name" type="button">Salvar</button>
        <button class="btn btn-ghost" data-action="close-modal" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="scripts/core/theme.js"></script>
  <script src="scripts/core/store.js"></script>
  <script src="scripts/core/shell.js"></script>
  <script src="scripts/pages/dashboard.js"></script>
</body>

</html>
